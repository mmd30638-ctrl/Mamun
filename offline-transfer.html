<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>অফলাইন ট্রান্সফার</title>
  <style id="ame-offline-css">
body{font-family:sans-serif;background:#ffffff;margin:0;padding:16px;color:#111111}
.wrap{max-width:640px;margin:0 auto}
.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px;border:1px solid #e5e5e5}
h1{margin:0 0 8px;font-size:20px;color:#111}
p{color:#333;line-height:1.5}
input,select,textarea{width:100%;padding:11px 12px;border:1.5px solid #d4d4d4;border-radius:10px;box-sizing:border-box;margin-top:6px;background:#fff;color:#111}
label{font-size:12px;font-weight:800;display:block;margin-top:10px;color:#111}
.hit{padding:10px 0;border-bottom:1px solid #f1f5f9;cursor:pointer}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 4px;border-bottom:1px solid #e5e5e5;text-align:left;color:#111}
.btn{width:100%;margin-top:12px;padding:14px;border:0;border-radius:12px;background:#111;color:#fff;font-weight:800;cursor:pointer;display:block;text-align:center;text-decoration:none}
.ghost{background:#fff;color:#111;border:1px solid #e5e5e5}
.ok{display:none;background:#f5f5f5;color:#111;padding:10px;border-radius:10px;margin-bottom:10px;font-weight:700;border:1px solid #e5e5e5}
.warn{background:#fff;color:#111;padding:10px;border-radius:10px;font-size:13px;margin-bottom:10px;border:1px solid #e5e5e5}
a{color:#111;font-weight:800;text-decoration:none}
.tot{font-size:18px;font-weight:800;text-align:right;margin-top:8px}
.grid{display:grid;gap:10px;margin:16px 0}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi div{border:1px solid #e5e5e5;border-radius:12px;padding:10px}
.kpi b{display:block;font-size:20px}
.kpi span{font-size:12px;color:#525252}
.qty{display:inline-flex;gap:6px;align-items:center}
.qty button{width:28px;height:28px;border:0;border-radius:8px;background:#f5f5f5;font-weight:800;cursor:pointer;color:#111}
.off-bar{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.off-bar a{font-size:12px;padding:8px 10px;border-radius:999px;background:#fff;border:1px solid #e5e5e5;color:#111;font-weight:800}
.sec{font-size:11px;font-weight:800;letter-spacing:.06em;color:#525252;margin:16px 0 6px;text-transform:uppercase}
.grid.two{grid-template-columns:1fr 1fr}
  </style>
  <link rel="stylesheet" href="/assets/css/offline-app.css?v=10.98.33">
  <link rel="stylesheet" href="/assets/css/submit-spinner.css?v=10.98.33">
  <link rel="stylesheet" href="/assets/css/light-studio.css?v=10.98.33">
</head>
<body>
  <div class="wrap">
    <div class="off-bar" id="ame-offline-nav"></div>
    <div class="card">
      <h1>অ্যাকাউন্ট ট্রান্সফার</h1>
      <p>ক্যাশ/ব্যাংক থেকে অন্য অ্যাকাউন্টে। বড় ট্রান্সফারে PIN লাগলে অনলাইনে করুন।</p>
      <div class="warn" id="warn" style="display:none">অ্যাকাউন্ট নেই। আগে অনলাইনে একবার সাইট খুলুন।</div>
      <div class="ok" id="okBox"></div>
      <label>যেখান থেকে</label>
      <select id="from_account"></select>
      <label>যেখানে</label>
      <select id="to_account"></select>
      <label>পরিমাণ (৳)</label>
      <input id="amount" type="number" step="0.01" min="0.01">
      <label>অনুমোদন PIN (যদি লাগে)</label>
      <input id="approval_pin" type="password" autocomplete="off">
      <button class="btn" type="button" id="go">ট্রান্সফার সংরক্ষণ করুন</button>
    </div>
    <div class="card">
      <h1>নগদ জমা / খরচ</h1>
      <label>অ্যাকাউন্ট</label>
      <select id="txn_account"></select>
      <label>ধরন</label>
      <select id="txn_type">
        <option value="credit">জমা (credit)</option>
        <option value="debit">খরচ (debit)</option>
      </select>
      <label>পরিমাণ (৳)</label>
      <input id="txn_amount" type="number" step="0.01" min="0.01">
      <label>নোট *</label>
      <input id="txn_note" placeholder="কেন জমা/খরচ">
      <button class="btn" type="button" id="goTxn">লেনদেন সংরক্ষণ করুন</button>
    </div>
  </div>
    <script src="/assets/js/double-submit-guard.js?v=10.98.33"></script>
  <script src="/assets/js/offline-queue.js?v=10.82.0"></script>
  <script src="/assets/js/offline-payment-queue.js?v=10.77.2"></script>
  <script src="/assets/js/offline-boot.js?v=10.82.0"></script>
  <script>
    var accounts = AmeOfflineCatalog.loadAccounts() || [];
    if (!accounts.length) document.getElementById('warn').style.display='block';
    var opts = accounts.map(function(a){ return '<option value="'+a.id+'">'+a.name+'</option>'; }).join('') || '<option value="">অ্যাকাউন্ট নেই</option>';
    document.getElementById('from_account').innerHTML = opts;
    document.getElementById('to_account').innerHTML = opts;
    document.getElementById('txn_account').innerHTML = opts;
    if (accounts.length>1) document.getElementById('to_account').selectedIndex = 1;
    document.getElementById('go').addEventListener('click', function(){
      var from = Number(document.getElementById('from_account').value||0);
      var to = Number(document.getElementById('to_account').value||0);
      var amount = Number(document.getElementById('amount').value||0);
      if (!from || !to || from===to || !(amount>0)) { alert('দুই ভিন্ন অ্যাকাউন্ট ও পরিমাণ দিন'); return; }
      ameWaitSend(AmeOfflineWrite.sendTransfer({
        from_account: from, to_account: to, amount: amount,
        approval_pin: document.getElementById('approval_pin').value,
        csrf_token: window.AME_CSRF_TOKEN || ''
      })).then(function(res){
        var box=document.getElementById('okBox');
        box.style.display='block';
        if (res && res.ok) { box.textContent='ট্রান্সফার জমা হয়েছে।'; return; }
        if (res && res.queued) {
          box.textContent='ফোনে সংরক্ষিত। নেট ফিরলে যাবে। রেফ: '+res.ref;
          document.getElementById('amount').value='';
          return;
        }
        box.textContent=(res && res.error) || 'ট্রান্সফার যায়নি';
      });
    });
    document.getElementById('goTxn').addEventListener('click', function(){
      var accountId = Number(document.getElementById('txn_account').value||0);
      var amount = Number(document.getElementById('txn_amount').value||0);
      var note = document.getElementById('txn_note').value.trim();
      if (!accountId || !(amount>0) || !note) { alert('অ্যাকাউন্ট, পরিমাণ ও নোট দিন'); return; }
      ameWaitSend(AmeOfflineWrite.sendTxn({
        account_id: accountId,
        txn_type: document.getElementById('txn_type').value,
        amount: amount,
        note: note,
        csrf_token: window.AME_CSRF_TOKEN || ''
      })).then(function(res){
        var box=document.getElementById('okBox');
        box.style.display='block';
        if (res && res.ok) { box.textContent='লেনদেন জমা হয়েছে।'; return; }
        if (res && res.queued) {
          box.textContent='ফোনে সংরক্ষিত। নেট ফিরলে যাবে। রেফ: '+res.ref;
          document.getElementById('txn_amount').value='';
          document.getElementById('txn_note').value='';
          return;
        }
        box.textContent=(res && res.error) || 'লেনদেন যায়নি';
      });
    });
  </script>
</body>
</html>
