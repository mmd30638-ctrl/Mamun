<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>অফলাইন বিক্রয়</title>
  <style id="ame-offline-css">
body{font-family:sans-serif;background:#eef3fb;margin:0;padding:16px;color:#0b1e4d}
.wrap{max-width:640px;margin:0 auto}
.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 8px 20px rgba(15,35,80,.07)}
h1{margin:0 0 8px;font-size:20px}
p{color:#64748b;line-height:1.5}
input,select,textarea{width:100%;padding:11px 12px;border:1.5px solid #dbe4f0;border-radius:10px;box-sizing:border-box;margin-top:6px}
label{font-size:12px;font-weight:800;display:block;margin-top:10px}
.hit{padding:10px 0;border-bottom:1px solid #f1f5f9;cursor:pointer}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 4px;border-bottom:1px solid #eef2f7;text-align:left}
.btn{width:100%;margin-top:12px;padding:14px;border:0;border-radius:12px;background:linear-gradient(90deg,#2563eb,#22c55e);color:#fff;font-weight:800;cursor:pointer;display:block;text-align:center;text-decoration:none}
.ghost{background:#f8fbff;color:#0b1e4d;border:1px solid #dbe4f0}
.ok{display:none;background:#e7f7ef;color:#0e8f52;padding:10px;border-radius:10px;margin-bottom:10px;font-weight:700}
.warn{background:#fff8eb;color:#8a6100;padding:10px;border-radius:10px;font-size:13px;margin-bottom:10px}
a{color:#2563eb;font-weight:800;text-decoration:none}
.tot{font-size:18px;font-weight:800;text-align:right;margin-top:8px}
.grid{display:grid;gap:10px;margin:16px 0}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi div{border:1px solid #e8eef6;border-radius:12px;padding:10px}
.kpi b{display:block;font-size:20px}
.kpi span{font-size:12px;color:#64748b}
.qty{display:inline-flex;gap:6px;align-items:center}
.qty button{width:28px;height:28px;border:0;border-radius:8px;background:#e8eef6;font-weight:800;cursor:pointer}
.off-bar{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.off-bar a{font-size:12px;padding:8px 10px;border-radius:999px;background:#fff;border:1px solid #dbe4f0;color:#0b1e4d;font-weight:800}
.sec{font-size:11px;font-weight:800;letter-spacing:.06em;color:#64748b;margin:16px 0 6px;text-transform:uppercase}
.grid.two{grid-template-columns:1fr 1fr}
  </style>
  <link rel="stylesheet" href="/assets/css/offline-app.css?v=10.82.0">
  <link rel="stylesheet" href="/assets/css/submit-spinner.css?v=10.98.31">
</head>
<body>
  <div class="wrap">
    <div class="off-bar" id="ame-offline-nav"></div>
    <div class="card">
      <h1>অফলাইন বিক্রয়</h1>
      <p>পণ্য খুঁজে কার্টে নিন। নেট ফিরলে বিক্রয় সার্ভারে যাবে।</p>
      <div class="warn" id="warn" style="display:none">পণ্য তালিকা নেই। আগে একবার অনলাইনে যেকোনো পেজ খুলুন।</div>
      <div class="ok" id="okBox"></div>
      <label>পণ্য খুঁজুন</label>
      <input id="q" placeholder="নাম বা কোড" autocomplete="off">
      <div id="hits"></div>
    </div>
    <div class="card">
      <table>
        <thead><tr><th>পণ্য</th><th>পরিমাণ</th><th>মোট</th></tr></thead>
        <tbody id="cart"></tbody>
      </table>
      <div class="tot" id="total">৳ 0</div>
      <label>কাস্টমার (ঐচ্ছিক)</label>
      <input id="cq" placeholder="নাম বা মোবাইল">
      <input type="hidden" id="cid">
      <div id="chits"></div>
      <label>অ্যাকাউন্ট</label>
      <select id="account"></select>
      <button class="btn" type="button" id="go">বিক্রয় সংরক্ষণ করুন</button>
    </div>
  </div>
    <script src="/assets/js/double-submit-guard.js?v=10.98.31"></script>
  <script src="/assets/js/offline-queue.js?v=10.82.0"></script>
  <script src="/assets/js/offline-payment-queue.js?v=10.77.2"></script>
  <script src="/assets/js/offline-boot.js?v=10.82.0"></script>
  <script>
    var cart = [];
    var products = [];
    var customers = [];
    var accounts = [];
    try { products = (AmeOfflineCatalog && AmeOfflineCatalog.loadProducts()) || []; } catch(e){}
    try { customers = (AmeOfflineCatalog && AmeOfflineCatalog.loadCustomers()) || []; } catch(e){}
    try { accounts = (AmeOfflineCatalog && AmeOfflineCatalog.loadAccounts()) || []; } catch(e){}
    if (!products.length) document.getElementById('warn').style.display = 'block';
    var acc = document.getElementById('account');
    acc.innerHTML = accounts.map(function(a){ return '<option value="'+a.id+'">'+a.name+'</option>'; }).join('') || '<option value="">অ্যাকাউন্ট নেই</option>';
    function money(n){ return '৳ ' + (Number(n)||0).toLocaleString('en-US',{maximumFractionDigits:2}); }
    function total(){ return cart.reduce(function(s,i){ return s + i.current_price * i.qty; }, 0); }
    function draw(){
      document.getElementById('cart').innerHTML = cart.map(function(i, idx){
        return '<tr><td>'+i.name+'</td><td class="qty"><button data-d="'+idx+'" type="button">−</button> '+i.qty+' <button data-u="'+idx+'" type="button">+</button></td><td>'+money(i.current_price*i.qty)+'</td></tr>';
      }).join('');
      document.getElementById('total').textContent = money(total());
    }
    document.getElementById('cart').addEventListener('click', function(e){
      var u = e.target.getAttribute('data-u');
      var d = e.target.getAttribute('data-d');
      if (u!=null) cart[Number(u)].qty += 1;
      if (d!=null) { cart[Number(d)].qty -= 1; if (cart[Number(d)].qty<=0) cart.splice(Number(d),1); }
      draw();
    });
    document.getElementById('q').addEventListener('input', function(){
      var q = this.value.trim();
      var hits = (q.length>=2 || /^\d+$/.test(q)) && AmeOfflineCatalog ? AmeOfflineCatalog.searchProducts(q) : [];
      document.getElementById('hits').innerHTML = hits.map(function(p){
        return '<div class="hit" data-id="'+p.id+'"><b>'+p.name+'</b><br><small>'+(p.sku||'')+' · স্টক '+(p.stock||0)+' · '+money(p.sale_price)+'</small></div>';
      }).join('');
    });
    document.getElementById('hits').addEventListener('click', function(e){
      var row = e.target.closest('[data-id]'); if(!row) return;
      var id = Number(row.getAttribute('data-id'));
      var p = products.filter(function(x){ return x.id===id; })[0];
      if (!p) return;
      var ex = cart.filter(function(i){ return i.id===p.id; })[0];
      if (ex) ex.qty += 1;
      else cart.push({ id:p.id, sku:p.sku||'', name:p.name, sale_price:p.sale_price, wholesale_price:p.wholesale_price, dealer_price:p.dealer_price, stock:p.stock, current_price:p.sale_price, qty:1, is_custom:false, unit:p.unit||'' });
      document.getElementById('q').value='';
      document.getElementById('hits').innerHTML='';
      draw();
    });
    document.getElementById('cq').addEventListener('input', function(){
      document.getElementById('cid').value='';
      var q=this.value.trim().toLowerCase();
      if(!q){ document.getElementById('chits').innerHTML=''; return; }
      document.getElementById('chits').innerHTML = customers.filter(function(c){
        return (c.name||'').toLowerCase().indexOf(q)!==-1 || (c.phone||'').indexOf(q)!==-1 || (c.code||'').toLowerCase().indexOf(q)!==-1;
      }).slice(0,15).map(function(c){
        return '<div class="hit" data-cid="'+c.id+'" data-name="'+String(c.name).replace(/"/g,'')+'"><b>'+c.name+'</b> <small>'+(c.phone||'')+' · বকেয়া '+money(c.balance)+'</small></div>';
      }).join('');
    });
    document.getElementById('chits').addEventListener('click', function(e){
      var row=e.target.closest('[data-cid]'); if(!row) return;
      document.getElementById('cid').value=row.getAttribute('data-cid');
      document.getElementById('cq').value=row.getAttribute('data-name');
      document.getElementById('chits').innerHTML='';
    });
    document.getElementById('go').addEventListener('click', function(){
      if (!cart.length) { alert('কার্ট খালি'); return; }
      var pay = total();
      var accountId = Number(document.getElementById('account').value||0);
      if (!accountId) { alert('অ্যাকাউন্ট বাছাই করুন — আগে একবার অনলাইনে যেকোনো পেজ খুলুন'); return; }
      var cid = Number(document.getElementById('cid').value||0);
      var payload = {
        action:'complete', cart: cart, customer_id: cid || null,
        customer_type: cid ? 'Registered' : 'Retail',
        subtotal: pay, discount: 0, vat_percent: 0, rounding: 0, service_amount: 0, services: [],
        payments: [{ account_id: accountId, amount: pay, reference_number: '' }],
        exchange: [], adjust_due: false, sms: false,
        csrf_token: window.AME_CSRF_TOKEN || '',
        offline_client_ref: AmeOfflineQueue.makeRef()
      };
      ameWaitSend(AmeOfflineQueue.sendSale(payload)).then(function(res){
        var box=document.getElementById('okBox');
        box.style.display='block';
        if (res && res.ok) {
          box.textContent='বিক্রয় জমা হয়েছে।';
          if (res.sale_id) location.href='/modules/sales/invoice_digital.php?id='+res.sale_id;
          return;
        }
        if (res && res.queued) {
          box.textContent='ফোনে সংরক্ষিত। নেট ফিরলে জমা হবে। রেফ: '+res.ref;
          cart=[]; draw();
          return;
        }
        box.textContent=(res && res.error) || 'বিক্রয় যায়নি';
      });
    });
  </script>
</body>
</html>
