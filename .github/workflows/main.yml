name: Dynamic Deploy to Any Site

on:
  workflow_dispatch:
    inputs:
      site_domain:
        description: 'কোন ডোমেইনে কোড আপলোড করতে চান? (যেমন: darkgrey-falcon-910368.hostingersite.com)'
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Get latest code
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Upload files to Hostinger
        run: |
          lftp -f "
          open ftp://${{ secrets.HOSTINGER_FTP_USER }}:${{ secrets.HOSTINGER_FTP_PASS }}@${{ secrets.HOSTINGER_FTP_SERVER }}:21
          mirror -R ./ ./domains/${{ github.event.inputs.site_domain }}/public_html/
          bye
          "
          
