name: Dynamic Deploy to Any Site

on:
  workflow_dispatch:
    inputs:
      site_domain:
        description: 'কোন ডোমেইনে কোড আপলোড করতে চান? (যেমন: darkgrey-falcon-910368.hostingersite.com)'
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Sync files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USER }}
          password: ${{ secrets.HOSTINGER_FTP_PASS }}
          server-dir: ./domains/${{ github.event.inputs.site_domain }}/public_html/
          port: 21
          
