; APONSHOP Hostinger — public_html/.user.ini
; Path is relative to this file, so any domain works.

auto_prepend_file=ame_boot.php

memory_limit=256M
max_execution_time=180
max_input_time=180
max_input_vars=5000
upload_max_filesize=64M
post_max_size=64M
max_file_uploads=40
display_errors=Off
log_errors=On
default_charset=UTF-8
date.timezone=Asia/Dhaka

; Demo host path if relative prepend fails:
; auto_prepend_file=/home/u718102670/public_html/ame_boot.php
