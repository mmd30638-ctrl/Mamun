<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>অফলাইন ওয়ার্কশপ</title>
  <style id="ame-offline-css">
body{font-family:sans-serif;background:#eef3fb;margin:0;padding:16px;color:#0b1e4d}
.wrap{max-width:640px;margin:0 auto}
.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 8px 20px rgba(15,35,80,.07)}
h1{margin:0 0 8px;font-size:20px}
p{color:#64748b;line-height:1.5}
input,select,textarea{width:100%;padding:11px 12px;border:1.5px solid #dbe4f0;border-radius:10px;box-sizing:border-box;margin-top:6px}
label{font-size:12px;font-weight:800;display:block;margin-top:10px}
.hit{padding:10px 0;border-bottom:1px solid #f1f5f9;cursor:pointer}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 4px;border-bottom:1px solid #eef2f7;text-align:left}
.btn{width:100%;margin-top:12px;padding:14px;border:0;border-radius:12px;background:linear-gradient(90deg,#2563eb,#22c55e);color:#fff;font-weight:800;cursor:pointer;display:block;text-align:center;text-decoration:none}
.ghost{background:#f8fbff;color:#0b1e4d;border:1px solid #dbe4f0}
.ok{display:none;background:#e7f7ef;color:#0e8f52;padding:10px;border-radius:10px;margin-bottom:10px;font-weight:700}
.warn{background:#fff8eb;color:#8a6100;padding:10px;border-radius:10px;font-size:13px;margin-bottom:10px}
a{color:#2563eb;font-weight:800;text-decoration:none}
.tot{font-size:18px;font-weight:800;text-align:right;margin-top:8px}
.grid{display:grid;gap:10px;margin:16px 0}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi div{border:1px solid #e8eef6;border-radius:12px;padding:10px}
.kpi b{display:block;font-size:20px}
.kpi span{font-size:12px;color:#64748b}
.qty{display:inline-flex;gap:6px;align-items:center}
.qty button{width:28px;height:28px;border:0;border-radius:8px;background:#e8eef6;font-weight:800;cursor:pointer}
.off-bar{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.off-bar a{font-size:12px;padding:8px 10px;border-radius:999px;background:#fff;border:1px solid #dbe4f0;color:#0b1e4d;font-weight:800}
.sec{font-size:11px;font-weight:800;letter-spacing:.06em;color:#64748b;margin:16px 0 6px;text-transform:uppercase}
.grid.two{grid-template-columns:1fr 1fr}
  </style>
  <link rel="stylesheet" href="/assets/css/offline-app.css?v=10.82.0">
  <link rel="stylesheet" href="/assets/css/submit-spinner.css?v=10.98.31">
</head>
<body>
  <div class="wrap">
    <div class="off-bar" id="ame-offline-nav"></div>
    <div class="card">
      <h1>নতুন ওয়ার্কশপ জব</h1>
      <p>ক্রেতা ও মেশিন লিখে জব ফোনে রাখুন। নেট ফিরলে সার্ভারে যাবে।</p>
      <div class="ok" id="okBox"></div>
      <label>ক্রেতা (ঐচ্ছিক)</label>
      <input id="cq" placeholder="নাম বা মোবাইল">
      <input type="hidden" id="customer_id">
      <div id="chits"></div>
      <label>ক্রেতার নাম *</label>
      <input id="customer_name" required>
      <label>মোবাইল</label>
      <input id="phone">
      <label>মেশিন / আইটেম *</label>
      <input id="item_name" placeholder="জেনারেটর / ইঞ্জিন">
      <label>সমস্যা</label>
      <textarea id="complaint" rows="3"></textarea>
      <label>লেবার চার্জ (৳)</label>
      <input id="labor_charge" type="number" step="0.01" min="0" value="0">
      <label>নোট</label>
      <input id="notes">
      <button class="btn" type="button" id="go">জব সংরক্ষণ করুন</button>
    </div>
  </div>
    <script src="/assets/js/double-submit-guard.js?v=10.98.31"></script>
  <script src="/assets/js/offline-queue.js?v=10.82.0"></script>
  <script src="/assets/js/offline-payment-queue.js?v=10.77.2"></script>
  <script src="/assets/js/offline-boot.js?v=10.82.0"></script>
  <script>
    var customers = (AmeOfflineCatalog && AmeOfflineCatalog.loadCustomers()) || [];
    document.getElementById('cq').addEventListener('input', function(){
      document.getElementById('customer_id').value='';
      var q=this.value.trim().toLowerCase();
      if(!q){ document.getElementById('chits').innerHTML=''; return; }
      document.getElementById('chits').innerHTML = customers.filter(function(c){
        return (c.name||'').toLowerCase().indexOf(q)!==-1 || (c.phone||'').indexOf(q)!==-1;
      }).slice(0,12).map(function(c){
        return '<div class="hit" data-id="'+c.id+'" data-name="'+String(c.name).replace(/"/g,'')+'" data-phone="'+(c.phone||'')+'"><b>'+c.name+'</b> <small>'+(c.phone||'')+'</small></div>';
      }).join('');
    });
    document.getElementById('chits').addEventListener('click', function(e){
      var row=e.target.closest('[data-id]'); if(!row) return;
      document.getElementById('customer_id').value=row.getAttribute('data-id');
      document.getElementById('customer_name').value=row.getAttribute('data-name');
      document.getElementById('phone').value=row.getAttribute('data-phone');
      document.getElementById('cq').value=row.getAttribute('data-name');
      document.getElementById('chits').innerHTML='';
    });
    document.getElementById('go').addEventListener('click', function(){
      var name = document.getElementById('customer_name').value.trim();
      var item = document.getElementById('item_name').value.trim();
      if (!name || !item) { alert('ক্রেতার নাম ও মেশিনের নাম লাগবে'); return; }
      ameWaitSend(AmeOfflineWrite.sendWorkshop({
        action: 'create_job',
        customer_id: document.getElementById('customer_id').value||0,
        customer_name: name,
        phone: document.getElementById('phone').value.trim(),
        item_name: item,
        complaint: document.getElementById('complaint').value.trim(),
        labor_charge: Number(document.getElementById('labor_charge').value||0),
        notes: document.getElementById('notes').value.trim(),
        csrf_token: window.AME_CSRF_TOKEN || ''
      })).then(function(res){
        var box=document.getElementById('okBox');
        box.style.display='block';
        if (res && res.ok) { box.textContent='জব জমা হয়েছে।'; return; }
        if (res && res.queued) {
          box.textContent='ফোনে সংরক্ষিত। নেট ফিরলে জব খুলবে। রেফ: '+res.ref;
          document.getElementById('item_name').value='';
          document.getElementById('complaint').value='';
          return;
        }
        box.textContent=(res && res.error) || 'জব যায়নি';
      });
    });
  </script>
</body>
</html>
